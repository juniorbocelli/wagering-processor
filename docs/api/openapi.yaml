openapi: 3.1.0
info:
  title: Distributed Wagering Processor
  version: 1.0.0
  description: |
    Processa transações de apostas (`BET`, `WIN`, `LOSS`, `REFUND`, `ROLLBACK`) enviadas por provedores de jogos,
    mantendo saldo, ledger auditável append-only e idempotência estrita sob duplicatas, mensagens fora de ordem
    e múltiplas instâncias.

    **Convenções**

    - Valores monetários são strings decimais com duas casas: `{ "amount": "25.00", "currency": "BRL" }`.
      Notação científica, sinal negativo, vírgula e números JSON são recusados na entrada.
    - Toda resposta traz `X-Correlation-Id` (o recebido na requisição ou um UUIDv7 novo).
    - Erros têm o formato plano: `{ "code", "message", "violations"?, "correlationId" }`.
    - Rejeições de regra de negócio são persistidas com `status: REJECTED` e um `failureCode` do catálogo (ADR-007).
    - O mesmo processamento também está disponível de forma assíncrona pela fila SQS FIFO `wager-transactions.fifo`
      (ver `docs/api/messaging.md`).

    **Identidade e Autenticação.** Projetada de forma desacoplada via `ProviderIdentityPort` (ADR-006).
  license:
    name: Proprietary
tags:
  - name: Transactions
    description: Submissão e consulta de transações de apostas.
  - name: Wallets
    description: Abertura de wallets, saldo, ledger e reconciliação.
  - name: Operations
    description: Health checks, métricas, documentação e console operacional. Não exigem autenticação.

security:
  - bearerAuth: []

paths:
  /wagering/transactions:
    post:
      tags: [Transactions]
      operationId: submitWagerTransaction
      summary: Submete uma transação de aposta
      description: |
        Aplica a transação numa única transação SQL (transação, ledger, saldo e outbox). É idempotente: repetir
        a mesma `Idempotency-Key` com o mesmo payload devolve o resultado original com `idempotentReplay: true`.

        - `REFUND` e `ROLLBACK` exigem `referenceExternalTransactionId`. Se a referência ainda não chegou, a transação
          fica `PENDING_REFERENCE` (`202`) e é reavaliada em segundo plano.
        - A wallet precisa existir; um `walletId` desconhecido responde `404` (`WALLET_NOT_FOUND`) e não é persistido.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WagerTransactionRequest'
            examples:
              bet:
                summary: Aposta
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-123
                  playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                  walletId: 0192f290-1c55-7a3e-9a41-3f1b6e2c9d10
                  roundId: round-987
                  gameId: fortune-chimp
                  kind: BET
                  money: { amount: '25.00', currency: BRL }
              rollback:
                summary: Estorno de uma aposta
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-124
                  playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                  walletId: 0192f290-1c55-7a3e-9a41-3f1b6e2c9d10
                  roundId: round-987
                  gameId: fortune-chimp
                  kind: ROLLBACK
                  money: { amount: '25.00', currency: BRL }
                  referenceExternalTransactionId: transaction-123
      responses:
        '201':
          description: Transação aplicada pela primeira vez.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WagerTransactionResult' }
              example:
                transactionId: 0192f291-0d4e-7c11-8a7f-5b2e4f6a1c22
                providerId: provider-a
                externalTransactionId: transaction-123
                playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                walletId: 0192f290-1c55-7a3e-9a41-3f1b6e2c9d10
                roundId: round-987
                gameId: fortune-chimp
                status: PROCESSED
                kind: BET
                amount: { amount: '25.00', currency: BRL }
                failureCode: null
                balance: { amount: '975.00', currency: BRL }
                referenceTransactionId: null
                processedAt: '2026-10-22T15:00:00.000Z'
                idempotentReplay: false
        '200':
          description: Replay idêntico de uma transação já processada; devolve o resultado original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WagerTransactionResult' }
        '202':
          description: Aceita, aguardando a transação de referência (`PENDING_REFERENCE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WagerTransactionResult' }
        '422':
          description: Rejeitada por regra de negócio. A rejeição é persistida e também é idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WagerTransactionResult' }
              example:
                transactionId: 0192f291-0d4e-7c11-8a7f-5b2e4f6a1c23
                providerId: provider-a
                externalTransactionId: transaction-125
                playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                walletId: 0192f290-1c55-7a3e-9a41-3f1b6e2c9d10
                roundId: round-987
                gameId: fortune-chimp
                status: REJECTED
                kind: BET
                amount: { amount: '500.00', currency: BRL }
                failureCode: INSUFFICIENT_FUNDS
                balance: { amount: '10.00', currency: BRL }
                referenceTransactionId: null
                processedAt: null
                idempotentReplay: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500':
          description: 'Falha permanente de processamento (`status: FAILED`, `failureCode: PROCESSING_FAILED`) ou erro interno.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WagerTransactionResult'
                  - $ref: '#/components/schemas/Error'
        '503': { $ref: '#/components/responses/Unavailable' }

  /wagering/transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getWagerTransaction
      summary: Consulta uma transação pelo id interno
      description: |
        Quando a identidade do provedor é autenticada (ADR-006), consultar transação de outro provedor responde `403` (`PROVIDER_IDENTITY_MISMATCH`).
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transação encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /providers/{providerId}/wagering/transactions/{externalTransactionId}:
    get:
      tags: [Transactions]
      operationId: getWagerTransactionByExternalId
      summary: Consulta uma transação pelo id externo do provedor
      description: Quando autenticado, um provedor só pode consultar o próprio `providerId` (`403` caso contrário).
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
          example: provider-a
        - name: externalTransactionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          example: transaction-123
      responses:
        '200':
          description: Transação encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets:
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Abre uma wallet com saldo inicial
      description: |
        No máximo uma wallet por `playerId` + `currency`. Quando `initialBalance > 0`, gera na mesma transação SQL
        uma transação interna `OPENING`, lançamento `CREDIT` (`wallet_version = 1`) no ledger e eventos na outbox.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenWalletRequest' }
            example:
              playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
              initialBalance: { amount: '1000.00', currency: BRL }
      responses:
        '201':
          description: Wallet criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets/{walletId}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Consulta saldo e versão de uma wallet
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/{walletId}/ledger:
    get:
      tags: [Wallets]
      operationId: getWalletLedger
      summary: Lista o ledger da wallet em ordem crescente de versão
      description: |
        Paginação por cursor opaco (`base64url({"v": walletVersion})`, keyset estável sob inserções concorrentes);
        repita a chamada com `nextCursor` até ele vir `null`. `limit` fora de 1–200 ou cursor inválido respondem `400`.
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Valor de `nextCursor` da página anterior.
          schema: { type: string }
      responses:
        '200':
          description: Uma página do ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/{walletId}/reconciliation:
    post:
      tags: [Wallets]
      operationId: reconcileWallet
      summary: Reconcilia o saldo de uma wallet contra o ledger
      description: |
        Compara em transação `REPEATABLE READ READ ONLY` o saldo armazenado (`storedBalance`), o saldo reconstruído
        pelo ledger (`calculatedBalance`), a integridade da cadeia (`chainIntact`) e a versão (`versionConsistent`).
        Divergências **não** são corrigidas: são reportadas, logadas e contadas em métrica (ADR-012).
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Relatório da reconciliação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health/live:
    get:
      tags: [Operations]
      operationId: liveness
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Processo vivo.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Operations]
      operationId: readiness
      summary: Readiness probe
      description: Verifica PostgreSQL e SQS (timeout de 2 s por sonda).
      security: []
      responses:
        '200':
          description: Todas as dependências respondem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Alguma dependência está indisponível.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Métricas no formato de exposição do Prometheus
      security: []
      responses:
        '200':
          description: Métricas da instância.
          content:
            text/plain:
              schema: { type: string }

  /docs:
    get:
      tags: [Operations]
      operationId: apiDocs
      summary: Documentação interativa (Swagger UI)
      security: []
      responses:
        '200':
          description: Página HTML.
          content:
            text/html:
              schema: { type: string }

  /docs/openapi.json:
    get:
      tags: [Operations]
      operationId: openApiDocument
      summary: Especificação OpenAPI 3.1 em JSON
      security: []
      responses:
        '200':
          description: Documento OpenAPI 3.1.
          content:
            application/json:
              schema: { type: object }

  /console:
    get:
      tags: [Operations]
      operationId: operationalConsole
      summary: Console Operacional Autoral (Operational Workbench)
      security: []
      responses:
        '200':
          description: Página HTML do console interativo.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC de provedor (ADR-006; no-op por padrão no desafio).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave de idempotência obrigatória. Recomendado `{providerId}:{externalTransactionId}`.
      schema: { type: string, minLength: 1, maxLength: 255 }
      example: provider-a:transaction-123
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagado para logs, eventos e a resposta. Gerado (UUIDv7) quando ausente ou inválido.
      schema: { type: string }
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    CorrelationId:
      description: Correlation ID da requisição.
      schema: { type: string }

  responses:
    BadRequest:
      description: Payload, header ou parâmetro inválido (`VALIDATION_ERROR`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_ERROR
            message: 'Invalid request: Idempotency-Key: Header is required'
            violations:
              - field: Idempotency-Key
                message: Header is required
            correlationId: 0192f291-0d4e-7c11-8a7f-5b2e4f6a1c99
    Forbidden:
      description: Identidade autenticada diverge do provedor solicitado (`PROVIDER_IDENTITY_MISMATCH`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Wallet, transação ou rota inexistente (`WALLET_NOT_FOUND`, `TRANSACTION_NOT_FOUND`, `NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        `IDEMPOTENCY_KEY_REUSED`: mesma key usada com outro payload.
        `EXTERNAL_TRANSACTION_ID_REUSED`: mesmo id externo usado com outra key.
        `WALLET_ALREADY_EXISTS`: o jogador já possui wallet nessa moeda.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Falha transitória de infraestrutura (`TRANSIENT_FAILURE`). Seguro repetir com a mesma `Idempotency-Key`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9]\d{0,16})(\.\d{1,2})?$'
          example: '25.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: BRL

    WagerKind:
      type: string
      enum: [BET, WIN, LOSS, REFUND, ROLLBACK]
      description: |
        `BET` debita; `WIN` credita; `LOSS` registra resultado sem mover saldo (aceita `0.00`); `REFUND` estorna uma
        `BET`; `ROLLBACK` inverte a direção da referência (`BET` vira crédito; `WIN` e `REFUND` viram débito).

    TransactionStatus:
      type: string
      enum: [PENDING, PENDING_REFERENCE, PROCESSED, REJECTED, FAILED]

    FailureCode:
      type: string
      enum:
        - WALLET_PLAYER_MISMATCH
        - CURRENCY_MISMATCH
        - REFERENCE_SCOPE_MISMATCH
        - REFERENCE_KIND_NOT_ALLOWED
        - REFERENCE_NOT_PROCESSED
        - REFERENCE_ALREADY_REVERSED
        - AMOUNT_MISMATCH
        - INSUFFICIENT_FUNDS
        - REVERSAL_INSUFFICIENT_FUNDS
        - REFERENCE_NOT_FOUND
        - PROCESSING_FAILED
      description: Taxonomia fechada de códigos de falha de domínio (ver ADR-007).

    WagerTransactionRequest:
      type: object
      required:
        [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      properties:
        providerId: { type: string, minLength: 1, maxLength: 64 }
        externalTransactionId: { type: string, minLength: 1, maxLength: 128 }
        playerId: { type: string, minLength: 1, maxLength: 128 }
        walletId: { type: string, format: uuid }
        roundId: { type: string, minLength: 1, maxLength: 128 }
        gameId: { type: string, minLength: 1, maxLength: 128 }
        kind: { $ref: '#/components/schemas/WagerKind' }
        money: { $ref: '#/components/schemas/Money' }
        referenceExternalTransactionId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: Obrigatório para `REFUND` e `ROLLBACK`; opcional para `WIN` e `LOSS`.

    Transaction:
      type: object
      required:
        - transactionId
        - providerId
        - externalTransactionId
        - playerId
        - walletId
        - roundId
        - gameId
        - status
        - kind
        - amount
        - failureCode
        - balance
        - referenceTransactionId
        - processedAt
      properties:
        transactionId: { type: string, format: uuid }
        providerId: { type: string }
        externalTransactionId: { type: string }
        playerId: { type: string }
        walletId: { type: string, format: uuid }
        roundId: { type: string }
        gameId: { type: string }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        kind:
          type: string
          enum: [OPENING, BET, WIN, LOSS, REFUND, ROLLBACK]
        amount: { $ref: '#/components/schemas/Money' }
        failureCode:
          oneOf:
            - $ref: '#/components/schemas/FailureCode'
            - type: 'null'
        balance:
          description: Saldo da wallet observado ao decidir a transação. `null` em `PENDING_REFERENCE` ou rejeições de identidade/moeda.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        referenceTransactionId: { type: [string, 'null'], format: uuid }
        processedAt: { type: [string, 'null'], format: date-time }

    WagerTransactionResult:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [idempotentReplay]
          properties:
            idempotentReplay: { type: boolean }

    OpenWalletRequest:
      type: object
      required: [playerId, initialBalance]
      properties:
        playerId: { type: string, minLength: 1, maxLength: 128 }
        initialBalance: { $ref: '#/components/schemas/Money' }

    Wallet:
      type: object
      required: [id, walletId, playerId, balance, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        playerId: { type: string }
        balance: { $ref: '#/components/schemas/Money' }
        version:
          type: integer
          minimum: 1
          description: Inicia em 1 e incrementa somente quando o saldo muda.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LedgerEntry:
      type: object
      required: [entryId, transactionId, direction, amount, balanceBefore, balanceAfter, walletVersion, createdAt]
      properties:
        entryId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/Money' }
        balanceBefore: { $ref: '#/components/schemas/Money' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
        walletVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        nextCursor: { type: [string, 'null'] }

    ReconciliationReport:
      type: object
      required:
        [
          walletId,
          storedBalance,
          calculatedBalance,
          difference,
          consistent,
          checkedEntries,
          chainIntact,
          versionConsistent,
        ]
      properties:
        walletId: { type: string, format: uuid }
        storedBalance: { $ref: '#/components/schemas/Money' }
        calculatedBalance:
          $ref: '#/components/schemas/Money'
          description: Saldo reconstruído pelo ledger da wallet.
        difference:
          $ref: '#/components/schemas/Money'
          description: '`storedBalance - calculatedBalance`.'
        consistent: { type: boolean }
        checkedEntries: { type: integer, minimum: 0 }
        chainIntact:
          type: boolean
          description: Indica se a corrente de versões e saldos do ledger está contínua e íntegra.
        versionConsistent:
          type: boolean
          description: Indica se a versão da wallet reflete exatamente o último lançamento do ledger.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
          example: { postgres: up, sqs: up }

    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, example: WALLET_NOT_FOUND }
        message: { type: string }
        violations:
          description: Presente em `VALIDATION_ERROR`, com um item por campo inválido.
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        correlationId: { type: string }
